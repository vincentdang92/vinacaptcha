services:
  # 1. DATABASE
  postgres:
    image: postgres:15-alpine
    container_name: captcha_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-captcha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-captcha_password}
      POSTGRES_DB: ${POSTGRES_DB:-captcha_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-captcha_user} -d ${POSTGRES_DB:-captcha_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - captcha_net

  # 2. IN-MEMORY CACHE & TOKEN STORE
  redis:
    image: redis:7-alpine
    container_name: captcha_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - captcha_net

  # 3. BACKEND API (NestJS + Fastify)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: captcha_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=1024"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-captcha_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-captcha_db}
      BACKEND_DATABASE_HOST: postgres
      BACKEND_DATABASE_PORT: 5432
      BACKEND_DATABASE_USER: ${POSTGRES_USER:-captcha_user}
      BACKEND_DATABASE_PASS: ${POSTGRES_PASSWORD}
      BACKEND_DATABASE_NAME: ${POSTGRES_DB:-captcha_db}
      BACKEND_REDIS_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      APP_SALT: ${APP_SALT:-}
      APP_URL: ${APP_URL:-}
      ABUSEIPDB_KEY: ${ABUSEIPDB_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-NhanHoaCaptcha System}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - captcha_net

  # 4. ADMIN DASHBOARD (Refine + React 19)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/admin/v1"
    container_name: captcha_dashboard
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - captcha_net

  # 5. GATEWAY & CDN REVERSE PROXY (Nginx)
  gateway:
    image: nginx:alpine
    container_name: captcha_gateway
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
      - "${PORT_HTTPS:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./widget/dist:/usr/share/nginx/widget:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - dashboard
    networks:
      - captcha_net

volumes:
  postgres_data:
  redis_data:

networks:
  captcha_net:
    driver: bridge
