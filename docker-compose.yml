services:
  # 1. DATABASE
  postgres:
    image: postgres:15-alpine
    container_name: captcha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-captcha_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-captcha_password}
      POSTGRES_DB: ${POSTGRES_DB:-captcha_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-captcha_user} -d ${POSTGRES_DB:-captcha_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - captcha_net

  # 2. IN-MEMORY CACHE & TOKEN STORE
  redis:
    image: redis:7-alpine
    container_name: captcha_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - captcha_net

  # 3. BACKEND API (NestJS + Fastify)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: captcha_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_DATABASE_HOST: postgres
      BACKEND_DATABASE_PORT: 5432
      BACKEND_DATABASE_USER: ${POSTGRES_USER:-captcha_user}
      BACKEND_DATABASE_PASS: ${POSTGRES_PASSWORD}
      BACKEND_DATABASE_NAME: ${POSTGRES_DB:-captcha_db}
      BACKEND_REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      APP_SALT: ${APP_SALT:-}
      APP_URL: ${APP_URL:-}
      ABUSEIPDB_KEY: ${ABUSEIPDB_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - captcha_net

  # 4. ADMIN DASHBOARD (Refine + React 19)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/admin/v1"
    container_name: captcha_dashboard
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - captcha_net

  # 5. GATEWAY & CDN REVERSE PROXY (Nginx)
  gateway:
    image: nginx:alpine
    container_name: captcha_gateway
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/vina-captcha.conf:/etc/nginx/conf.d/vina-captcha.conf:ro
      - ./widget/dist:/usr/share/nginx/widget:ro
    depends_on:
      - backend
      - dashboard
    networks:
      - captcha_net

volumes:
  postgres_data:
  redis_data:

networks:
  captcha_net:
    driver: bridge
