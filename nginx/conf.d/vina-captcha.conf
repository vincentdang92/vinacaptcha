# Upstream definition for load balancing and internal routing
upstream backend_cluster {
    server backend:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

upstream dashboard_service {
    server dashboard:80;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Client Body Limit (tối ưu cho API captcha gọn nhẹ)
    client_max_body_size 2M;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 1. Tĩnh Widget JS Distribution (CDN-ready, CORS mở cho mọi site khách nhúng)
    location /widget/ {
        alias /usr/share/nginx/widget/;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        # Đảm bảo file JS luôn tươi mới 100% tức thì khi deploy bản mới mà không cần user đổi URL
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag on;
        try_files $uri $uri/ /vina-captcha.js =404;
    }

    # 2. Backend Public API (/v1/issue, /v1/verify, /v1/siteverify)
    location /v1/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout tối ưu cho hot path latency
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # 3. Backend Admin API (/admin/v1/*)
    location /admin/v1/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 4. Admin Dashboard SPA
    location / {
        proxy_pass http://dashboard_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
